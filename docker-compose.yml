name: nakama-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 20

  nakama:
    image: nakama-dev/nakama:local
    build:
      context: ./server
    depends_on:
      postgres:
        condition: service_healthy
    # Run schema migrations, then start the server. Secrets come from .env via
    # the environment block below; non-secret settings live in server/config/local.yml.
    entrypoint:
      - /bin/sh
      - -ec
      - >
        /nakama/nakama migrate up
        --database.address "nakama:$${POSTGRES_PASSWORD}@postgres:5432/nakama" &&
        exec /nakama/nakama
        --config /nakama/data/local.yml
        --database.address "nakama:$${POSTGRES_PASSWORD}@postgres:5432/nakama"
        --socket.server_key "$${NAKAMA_SERVER_KEY}"
        --runtime.http_key "$${NAKAMA_HTTP_KEY}"
        --session.encryption_key "$${NAKAMA_SESSION_ENCRYPTION_KEY}"
        --session.refresh_encryption_key "$${NAKAMA_REFRESH_ENCRYPTION_KEY}"
        --console.username "$${NAKAMA_CONSOLE_USERNAME}"
        --console.password "$${NAKAMA_CONSOLE_PASSWORD}"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:-defaultkey}
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:-defaulthttpkey}
      NAKAMA_SESSION_ENCRYPTION_KEY: ${NAKAMA_SESSION_ENCRYPTION_KEY:-change-me-session-encryption-key}
      NAKAMA_REFRESH_ENCRYPTION_KEY: ${NAKAMA_REFRESH_ENCRYPTION_KEY:-change-me-refresh-encryption-key}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME:-admin}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:-password}
    ports:
      - "7349:7349" # gRPC API
      - "7350:7350" # HTTP + WebSocket API (what the Unity client talks to)
      - "7351:7351" # Developer console
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
